name: Release

on:
  push:
    branches: [main]

# never run two releases at once and do not cancel one mid-flight
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:

  # ======= START VERSION =======

  version:
    name: compute version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      changelog: ${{ steps.bump.outputs.changelog }}
      skip: ${{ steps.bump.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # version is decided by deploy.ps1, not by CI - it bumps package.json,
      # src-tauri/Cargo.toml, src-tauri/Cargo.lock and src-tauri/tauri.conf.json
      # together before pushing to main. This step only reads package.json as
      # the source of truth and verifies the other three agree with it.
      - name: Read and verify version
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          pkg_version=$(jq -r '.version' package.json)
          cargo_version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          lock_version=$(awk '/^name = "open-store"$/{getline; print; exit}' src-tauri/Cargo.lock | sed -E 's/version = "(.*)"/\1/')
          conf_version=$(jq -r '.version' src-tauri/tauri.conf.json)

          if [ "$pkg_version" != "$cargo_version" ] || [ "$pkg_version" != "$lock_version" ] || [ "$pkg_version" != "$conf_version" ]; then
            echo "version mismatch: package.json=$pkg_version Cargo.toml=$cargo_version Cargo.lock=$lock_version tauri.conf.json=$conf_version"
            echo "run deploy.ps1 so all four files are bumped together"
            exit 1
          fi

          tag="v${pkg_version}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists, nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)
          if [ -n "$latest" ]; then
            changelog=$(git log "$latest"..HEAD --no-merges --pretty=format:'- %s')
          else
            changelog=$(git log --no-merges --pretty=format:'- %s')
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ======= END VERSION =======

  # ======= START CHECK =======

  check:
    name: fmt · clippy · build · test
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features

      - name: Build
        working-directory: src-tauri
        run: cargo build --all-targets

      - name: Test
        working-directory: src-tauri
        run: cargo test --all-features

  # ======= END CHECK =======

  # ======= START RELEASE =======

  release:
    name: Windows installer · GitHub release
    needs: [version, check]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.changelog }}
          releaseDraft: false
          prerelease: false

  # ======= END RELEASE =======
